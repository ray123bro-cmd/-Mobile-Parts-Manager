name: إنشاء ملف APK لنظام Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: إنشاء ملف APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Parts-Manager-APK
          path: app/build/outputs/apk/debug/*.apk

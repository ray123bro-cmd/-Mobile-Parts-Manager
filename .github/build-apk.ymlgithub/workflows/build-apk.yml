name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          echo "Android project files:"
          find "برنامج/برنامج" -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew -p "برنامج/برنامج" assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "برنامج/برنامج" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Parts-Manager-APK
          path: "برنامج/برنامج/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
